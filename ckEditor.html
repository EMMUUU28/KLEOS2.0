<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CKEditor 4 Example</title>
    <!-- Include CKEditor JavaScript -->
    <script src="https://cdn.ckeditor.com/4.17.2/standard/ckeditor.js"></script>
</head>
<body>
    <h1>Edit Your Content</h1>
    <textarea id="editor1" name="editor1">&lt;p&gt;Initial editor content.&lt;/p&gt;</textarea>
    <script>
        // Replace the <textarea id="editor1"> with CKEditor
        CKEDITOR.replace('editor1');
    </script>
</body>
</html>
